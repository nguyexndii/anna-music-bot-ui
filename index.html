<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Anna Music • Boutique Vinyl Lounge & Web Player</title>
    <link rel="icon" type="image/gif" href="/logo.gif" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#111316] text-[#e2e2e6] antialiased selection:bg-[#e8c977]/25 selection:text-[#ffe6a9] overflow-hidden">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #111316; color: #aba395; font-family: 'Be Vietnam Pro', sans-serif; text-align: center; padding: 24px;">
        <div style="position: relative; width: 84px; height: 84px; margin: 0 auto 20px;">
          <img src="/logo.gif" alt="Anna Music Logo" style="width: 84px; height: 84px; border-radius: 22px; object-fit: cover; border: 1px solid rgba(232, 201, 119, 0.35); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(232, 201, 119, 0.2); image-rendering: pixelated; display: block;" />
        </div>
        <div style="font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 6px;">
          <span style="font-family: 'Playfair Display', serif; color: #e8c977;">an</span><span style="font-family: 'Playfair Display', serif; color: #f5a192;">na</span>
          <span style="font-family: 'Be Vietnam Pro', sans-serif; font-size: 14px; font-weight: 600; color: #aba395; margin-left: 8px; letter-spacing: 0.12em; text-transform: uppercase;">Vinyl Lounge</span>
        </div>
        <p style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.22em; color: #7f786c; margin: 0 0 22px; text-transform: uppercase;">BOUTIQUE DISCORD SOUNDBOT CONSOLE</p>
        <div style="width: 120px; height: 3px; background: #1c1e22; border-radius: 999px; overflow: hidden; margin: 0 auto 14px;">
          <div style="height: 100%; width: 45%; background: linear-gradient(90deg, #e8c977, #ef7864); border-radius: 999px; animation: pulseSlide 1.25s cubic-bezier(0.4, 0, 0.2, 1) infinite;"></div>
        </div>
        <p style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: #7f786c; margin: 0;">ĐANG KHỞI TẠO PHÒNG TRẢI NGHIỆM VINYL...</p>
        <style>@keyframes pulseSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
