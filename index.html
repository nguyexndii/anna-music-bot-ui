<!DOCTYPE html>

<html lang="vi">

  <head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Anna Music • Cyber Studio Player</title>

    <link rel="icon" type="image/gif" href="/logo.gif" />

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  </head>

  <body class="bg-[#06080F] text-slate-100 antialiased selection:bg-cyan-500/25 selection:text-cyan-300">

    <div id="root">

      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #06080F; color: #94a3b8; font-family: 'Be Vietnam Pro', sans-serif; text-align: center; padding: 24px;">

        <div style="position: relative; width: 84px; height: 84px; margin: 0 auto 20px;">

          <img src="/logo.gif" alt="Anna Music Logo" style="width: 84px; height: 84px; border-radius: 22px; object-fit: cover; border: 1px solid rgba(6, 182, 212, 0.35); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(6, 182, 212, 0.2); image-rendering: pixelated; display: block;" />

        </div>

        <div style="font-size: 24px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.2; margin-bottom: 6px; color: #f8fafc;">

          <span>ANNA</span><span style="color: #06b6d4; margin-left: 6px;">PULSE</span>

        </div>

        <p style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.22em; color: #64748b; margin: 0 0 22px; text-transform: uppercase;">NEXT-GEN DISCORD MUSIC CONSOLE</p>

        <div style="width: 120px; height: 3px; background: #1e293b; border-radius: 999px; overflow: hidden; margin: 0 auto 14px;">

          <div style="height: 100%; width: 45%; background: linear-gradient(90deg, #06b6d4, #6366f1); border-radius: 999px; animation: pulseSlide 1.25s cubic-bezier(0.4, 0, 0.2, 1) infinite;"></div>

        </div>

        <p style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: #64748b; margin: 0;">ĐANG KHỞI TẠO KHÔNG GIAN ÂM NHẠC...</p>

        <style>@keyframes pulseSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }</style>

      </div>

    </div>

    <script type="module" src="/src/main.jsx"></script>

  </body>

</html>
